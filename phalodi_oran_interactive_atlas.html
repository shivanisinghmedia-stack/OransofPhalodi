*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0;font-family:var(--font-sans)}

.top-sub{font-size:13px;color:var(--text-secondary)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.search-wrap{position:relative;grid-column:1/-1}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px}
#search{width:100%;padding:8px 10px 8px 34px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}

.stat-n{font-size:20px;font-weight:500;color:var(--text-primary)}
.stat-l{font-size:11px;color:var(--text-secondary);margin-top:2px}
.list-header{display:grid;grid-template-columns:36px 1fr 110px 90px;gap:8px;padding:6px 12px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;font-size:11px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.list-wrap{border:0.5px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);max-height:320px;overflow-y:auto}
.oran-row{display:grid;grid-template-columns:36px 1fr 110px 90px;gap:8px;padding:8px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .12s;align-items:center}
.oran-row:last-child{border-bottom:none}
.oran-row:hover{background:var(--surface-1)}
.oran-row.active{background:var(--bg-accent)!important}
.row-no{font-size:12px;color:var(--text-muted);text-align:center}
.row-name{font-size:13px;color:var(--text-primary);font-weight:500}

.detail-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem;margin-top:1rem}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.detail-icon{width:44px;height:44px;border-radius:50%;background:var(--bg-success);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.detail-title{font-size:16px;font-weight:500;color:var(--text-primary)}
.detail-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-field{background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.field-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}

.empty{padding:2rem;text-align:center;color:var(--text-muted);font-size:13px}

let filtered=orans, selected=null;

function sizeLabel(a){
  if(a<50)return'Small';
  if(a<200)return'Medium';
  if(a<500)return'Large';
  return'Very large';
}

function render(){
  const lw=document.getElementById('listWrap');
  const totalArea=filtered.reduce((s,o)=>s+o[4],0);
  const uniqueTehsils=new Set(filtered.map(o=>o[2])).size;
  document.getElementById('sShowing').textContent=filtered.length;
  document.getElementById('sArea').textContent=totalArea>=1000?Math.round(totalArea/100)/10+'K':Math.round(totalArea);
  document.getElementById('sTehsil').textContent=uniqueTehsils;

  if(!filtered.length){
    lw.innerHTML='<div class="empty"><i class="ti ti-mood-sad" aria-hidden="true" style="font-size:24px;display:block;margin-bottom:8px"></i>No Orans match your search</div>';
    return;
  }
  lw.innerHTML=filtered.map(o=>{
    const tc=tehsilColors[o[2]]||{bg:'#f1f5f9',text:'#334155'};
    const isActive=selected&&selected[0]===o[0];
    return`<div class="oran-row${isActive?' active':''}" data-id="${o[0]}" role="button" tabindex="0" aria-label="${o[1]}, ${o[2]}, ${o[3]}, ${o[4]} hectares">
      <span class="row-no">${o[0]}</span>
      <div>
        <div class="row-name">${o[1]}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:1px">${o[3]}</div>
      </div>
      <div><span class="tehsil-badge" style="background:${tc.bg};color:${tc.text}">${o[2]}</span></div>
      <div class="row-area">${o[4].toFixed(2)}</div>
    </div>`;
  }).join('');

  lw.querySelectorAll('.oran-row').forEach(row=>{
    row.addEventListener('click',()=>selectOran(parseInt(row.dataset.id)));
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')selectOran(parseInt(row.dataset.id));});
  });
}

function selectOran(id){
  selected=orans.find(o=>o[0]===id);
  render();
  renderDetail();
  document.getElementById('detailArea').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function sizeCategory(a){
  if(a<50)return{label:'Small grove',icon:'ti-seedling'};
  if(a<200)return{label:'Medium grove',icon:'ti-trees'};
  if(a<500)return{label:'Large grove',icon:'ti-forest'};
  return{label:'Very large grove',icon:'ti-mountain'};
}

function renderDetail(){
  const da=document.getElementById('detailArea');
  if(!selected){
    da.innerHTML='<div class="no-sel"><i class="ti ti-hand-click" aria-hidden="true" style="font-size:20px;display:block;margin-bottom:6px"></i>Click any row above to see full details</div>';
    return;
  }
  const [no,village,tehsil,oranName,area]=selected;
  const tc=tehsilColors[tehsil]||{bg:'#f1f5f9',text:'#334155'};
  const {label:sizeLabel2,icon}=sizeCategory(area);
  const allInTehsil=orans.filter(o=>o[2]===tehsil);
  const totalTehsilArea=allInTehsil.reduce((s,o)=>s+o[4],0);
  const pct=((area/totalTehsilArea)*100).toFixed(1);
  const rankInTehsil=[...allInTehsil].sort((a,b)=>b[4]-a[4]).findIndex(o=>o[0]===no)+1;

  da.innerHTML=`<div class="detail-card">
    <div class="detail-header">
      <div class="detail-icon"><i class="ti ${icon}" aria-hidden="true"></i></div>
      <div>
        <div class="detail-title">${village}</div>
        <div class="detail-sub">${oranName}</div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-field">
        <div class="field-label">Tehsil</div>
        <div class="field-value"><span class="tehsil-badge" style="background:${tc.bg};color:${tc.text}">${tehsil}</span></div>
      </div>
      <div class="detail-field">
        <div class="field-label">Serial No.</div>
        <div class="field-value">#${no}</div>
      </div>
      <div class="detail-field">
        <div class="field-label">Area</div>
        <div class="field-value big">${area.toFixed(2)} ha</div>
      </div>
      <div class="detail-field">
        <div class="field-label">Size category</div>
        <div class="field-value">${sizeLabel2}</div>
      </div>
      <div class="detail-field">
        <div class="field-label">Rank in ${tehsil} Tehsil</div>
        <div class="field-value">#${rankInTehsil} of ${allInTehsil.length}</div>
      </div>
      <div class="detail-field">
        <div class="field-label">% of Tehsil area</div>
        <div class="field-value">${pct}%</div>
      </div>
    </div>
    <div style="margin-top:10px">
      <button onclick="sendPrompt('Tell me more about ${oranName} in ${village}, ${tehsil} Tehsil, Phalodi district')">Ask about this Oran ↗</button>
    </div>
  </div>`;
}

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const t=document.getElementById('tehsilFilter').value;
  const a=document.getElementById('areaFilter').value;
  filtered=orans.filter(o=>{
